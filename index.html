<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171717" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffe85a'/%3E%3Cpath d='M42 18a18 18 0 1 0 0 28' fill='none' stroke='%23171717' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />
<title>Chemistry F4 F5 2026</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#171717;--muted:#6d6d6d;--line:#deded8;--accent:#171717;--ok:#eef7e8;--bad:#fff0f0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
body{min-height:100vh;min-height:100dvh}.center{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.card{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 16px 50px rgba(0,0,0,.08)}
.logo{width:52px;height:52px;border-radius:16px;background:#ffe85a;display:grid;place-items:center;font-weight:1000;font-size:24px;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.title{font-size:32px;line-height:1.05;margin:8px 0 10px;font-weight:950;letter-spacing:-1px}.sub{color:var(--muted);margin:0 0 20px;line-height:1.65}.label{display:block;font-size:13px;font-weight:800;margin:14px 0 8px}.input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:#fff;font-size:16px;outline:none}.input:focus{border-color:#999}.btn{width:100%;min-height:48px;border:0;border-radius:14px;padding:14px 16px;font-weight:900;font-size:16px;cursor:pointer;touch-action:manipulation;background:var(--accent);color:#fff;margin-top:12px}.btn.secondary{background:#fff;color:#111;border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:wait}.status{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}.status.show{display:block}.status.ok{background:var(--ok)}.status.bad{background:var(--bad)}.tiny{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.55}.topbar{height:52px;padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));display:none;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topbar.show{display:flex}.brand{font-weight:900}.spacer{flex:1}.mini{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer;touch-action:manipulation}.lang{display:flex;justify-content:flex-end;margin-bottom:8px}.lang button{border:1px solid var(--line);background:#fff;min-height:42px;padding:7px 12px;font-weight:900;cursor:pointer;touch-action:manipulation}.lang button:first-child{border-radius:999px 0 0 999px}.lang button:last-child{border-radius:0 999px 999px 0}.lang button.active{background:#111;color:#fff}.appWrap{height:calc(100vh - 52px);height:calc(100dvh - 52px);display:none}.appWrap.show{display:block}.appFrame{width:100%;height:100%;border:0;background:#fff}.loading{min-height:100vh;min-height:100dvh;display:grid;place-items:center;color:var(--muted);font-weight:800}.hidden{display:none!important}@media(max-width:480px){.card{padding:22px 18px;border-radius:20px}.title{font-size:28px}.topbar .brand{font-size:13px}.topbar .tiny{display:none}}
</style>
</head>
<body>
<div id="loginView" class="center">
  <main class="card">
    <div class="lang"><button id="biBtn" class="active">BI</button><button id="bmBtn">BM</button></div>
    <div class="logo">C</div>
    <div class="eyebrow">SPM KSSM</div>
    <h1 class="title">Chemistry F4 F5 2026</h1>
    <p id="intro" class="sub">For registered buyers only. Enter the Gmail used for your purchase and we will send a one-time sign-in link.</p>
    <label class="label" for="email">Gmail</label>
    <input id="email" class="input" type="email" inputmode="email" autocomplete="email" placeholder="yourname@gmail.com" />
    <button id="sendBtn" class="btn">Send sign-in link</button>
    <div id="status" class="status"></div>
    <p id="note" class="tiny">Only an active Gmail on the access list can open the learning site.</p>
  </main>
</div>
<div id="loadingView" class="loading hidden">Checking access…</div>
<header id="topbar" class="topbar"><span class="brand">Chemistry F4 F5 2026</span><span class="spacer"></span><span id="userEmail" class="tiny" style="margin:0"></span><button id="logoutBtn" class="mini">Logout</button></header>
<div id="appWrap" class="appWrap"><iframe id="appFrame" class="appFrame" title="Chemistry F4 F5 2026"></iframe></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Replace these two values after creating the Supabase project.
const SUPABASE_URL = 'https://kiuvjelllwkhnbizpkpf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DYugWdVoH_YAyGSRQ-Ez7w_cVFMQeKn';
const FUNCTION_NAME = 'chemistry-content';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true,detectSessionInUrl:true}});
let UI_LANG=localStorage.getItem('salesLang')==='bm'?'bm':'bi';
const UI={bi:{intro:'For registered buyers only. Enter the Gmail used for your purchase and we will send a one-time sign-in link.',send:'Send sign-in link',sending:'Sending…',note:'Only an active Gmail on the access list can open the learning site.',checking:'Checking access…',invalid:'Enter a valid Gmail address.',denied:'This Gmail does not have active access, or the access period has expired.',sent:'The sign-in link has been sent. Open the link in your Gmail to continue.',load:'The course cannot be loaded right now. Please try again later. '},bm:{intro:'Untuk pembeli berdaftar sahaja. Masukkan Gmail yang digunakan semasa pembelian dan pautan log masuk sekali guna akan dihantar.',send:'Hantar pautan log masuk',sending:'Sedang dihantar…',note:'Hanya Gmail aktif dalam senarai akses boleh membuka laman pembelajaran.',checking:'Akses sedang disemak…',invalid:'Masukkan alamat Gmail yang sah.',denied:'Gmail ini tiada akses aktif atau tempoh akses telah tamat.',sent:'Pautan log masuk telah dihantar. Buka pautan dalam Gmail anda untuk meneruskan.',load:'Kursus tidak dapat dimuatkan sekarang. Cuba lagi kemudian. '}};

const loginView=document.getElementById('loginView'), loadingView=document.getElementById('loadingView'), statusBox=document.getElementById('status'), sendBtn=document.getElementById('sendBtn'), emailInput=document.getElementById('email'), topbar=document.getElementById('topbar'), appWrap=document.getElementById('appWrap'), appFrame=document.getElementById('appFrame'), userEmail=document.getElementById('userEmail');
function status(msg,ok=false){statusBox.textContent=msg;statusBox.className='status show '+(ok?'ok':'bad')}
function applyUi(){const t=UI[UI_LANG];document.documentElement.lang=UI_LANG==='bm'?'ms':'en';document.getElementById('intro').textContent=t.intro;document.getElementById('note').textContent=t.note;document.getElementById('loadingView').textContent=t.checking;if(!sendBtn.disabled)sendBtn.textContent=t.send;document.getElementById('biBtn').classList.toggle('active',UI_LANG==='bi');document.getElementById('bmBtn').classList.toggle('active',UI_LANG==='bm');localStorage.setItem('salesLang',UI_LANG)}
document.getElementById('biBtn').onclick=()=>{UI_LANG='bi';applyUi()};document.getElementById('bmBtn').onclick=()=>{UI_LANG='bm';applyUi()};applyUi();
function showLogin(){loginView.classList.remove('hidden');loadingView.classList.add('hidden');topbar.classList.remove('show');appWrap.classList.remove('show');appFrame.srcdoc=''}
function showLoading(){loginView.classList.add('hidden');loadingView.classList.remove('hidden');topbar.classList.remove('show');appWrap.classList.remove('show')}
async function loadProtectedApp(session){
  showLoading();
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}`, {headers:{Authorization:`Bearer ${session.access_token}`}});
    if(res.status===403){await sb.auth.signOut();showLogin();status(UI[UI_LANG].denied);return}
    if(!res.ok) throw new Error('Access service error: '+res.status);
    const html=await res.text();
    userEmail.textContent=session.user.email||'';
    appFrame.srcdoc=html;
    loadingView.classList.add('hidden');topbar.classList.add('show');appWrap.classList.add('show');
  }catch(e){showLogin();status(UI[UI_LANG].load+e.message)}
}
sendBtn.addEventListener('click', async()=>{
  const email=emailInput.value.trim().toLowerCase();
  if(!/^[^@\s]+@gmail\.com$/i.test(email)){status(UI[UI_LANG].invalid);return}
  sendBtn.disabled=true;sendBtn.textContent=UI[UI_LANG].sending;
  const redirectTo=location.origin+location.pathname;
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:true}});
  sendBtn.disabled=false;sendBtn.textContent=UI[UI_LANG].send;
  if(error){status(error.message);return}
  status(UI[UI_LANG].sent,true)
});
document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();showLogin()});
sb.auth.onAuthStateChange((_event,session)=>{if(session) loadProtectedApp(session); else showLogin()});
(async()=>{const {data:{session}}=await sb.auth.getSession(); if(session) loadProtectedApp(session);})();
</script>
</body>
</html>
