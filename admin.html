<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Chemistry Admin</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--line:#ddd;--ink:#171717;--muted:#717171}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);font-family:Inter,"Microsoft YaHei",system-ui;color:var(--ink)}.wrap{max-width:920px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.input,select{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:180px;font-size:16px}.btn{border:0;border-radius:12px;padding:11px 14px;min-height:44px;background:#111;color:#fff;font-weight:800;cursor:pointer;touch-action:manipulation}.btn.light{background:#fff;color:#111;border:1px solid var(--line)}h1{margin:0 0 6px}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee;font-size:14px}th{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;font-size:12px;font-weight:800}.on{background:#e6f6df}.off{background:#ffe4e4}.status{margin-top:10px;font-size:13px}.hidden{display:none}@media(max-width:600px){.wrap{padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}.card{padding:15px;border-radius:16px}.input,select,.btn{width:100%;min-width:0}table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}}</style></head>
<body><div class="wrap"><div class="card"><h1>Chemistry Admin</h1><p class="muted">这里控制哪些 Gmail 可以进入 Chemistry F4 F5 2026。</p><div id="loginBox"><div class="row"><input id="adminEmail" class="input" type="email" placeholder="你的管理员 Gmail"><button id="loginBtn" class="btn">Email Login</button></div><div id="loginStatus" class="status"></div></div><div id="adminBox" class="hidden"><div class="row"><span id="who" class="muted"></span><button id="logout" class="btn light">Logout</button></div></div></div>
<div id="panel" class="card hidden"><h2>新增 / 更新购买者</h2><div class="row"><input id="buyerEmail" class="input" type="email" placeholder="buyer@gmail.com"><select id="plan"><option value="lifetime">Lifetime</option><option value="30days">30 Days</option><option value="1year">1 Year</option></select><button id="addBtn" class="btn">授权 Gmail</button></div><div id="panelStatus" class="status"></div></div>
<div id="listCard" class="card hidden"><div class="row" style="align-items:center"><h2 style="margin-right:auto">Access List</h2><button id="refresh" class="btn light">Refresh</button></div><div style="overflow:auto"><table><thead><tr><th>Gmail</th><th>Plan</th><th>Expires</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://kiuvjelllwkhnbizpkpf.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_DYugWdVoH_YAyGSRQ-Ez7w_cVFMQeKn';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true}});
const q=s=>document.querySelector(s),loginBox=q('#loginBox'),adminBox=q('#adminBox'),panel=q('#panel'),listCard=q('#listCard');
function msg(sel,t){q(sel).textContent=t}
async function isAdmin(){const {data,error}=await sb.rpc('is_admin');return !error&&data===true}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){loginBox.classList.remove('hidden');adminBox.classList.add('hidden');panel.classList.add('hidden');listCard.classList.add('hidden');return}if(!(await isAdmin())){msg('#loginStatus','这个 Gmail 不是管理员。');await sb.auth.signOut();return}loginBox.classList.add('hidden');adminBox.classList.remove('hidden');panel.classList.remove('hidden');listCard.classList.remove('hidden');q('#who').textContent=session.user.email;await refresh()}
q('#loginBtn').onclick=async()=>{const email=q('#adminEmail').value.trim().toLowerCase();const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});msg('#loginStatus',error?error.message:'登录链接已发送。')};q('#logout').onclick=async()=>{await sb.auth.signOut();load()};
q('#addBtn').onclick=async()=>{const email=q('#buyerEmail').value.trim().toLowerCase();if(!/^[^@\s]+@gmail\.com$/i.test(email)){msg('#panelStatus','请输入 Gmail。');return}const plan=q('#plan').value;let expires_at=null;if(plan==='30days')expires_at=new Date(Date.now()+30*864e5).toISOString();if(plan==='1year')expires_at=new Date(Date.now()+365*864e5).toISOString();const {error}=await sb.from('entitlements').upsert({email,plan,active:true,expires_at},{onConflict:'email'});msg('#panelStatus',error?error.message:'已授权 '+email);if(!error){q('#buyerEmail').value='';refresh()}};
async function refresh(){const {data,error}=await sb.from('entitlements').select('*').order('created_at',{ascending:false});if(error){msg('#panelStatus',error.message);return}q('#rows').innerHTML=(data||[]).map(r=>`<tr><td>${r.email}</td><td>${r.plan||''}</td><td>${r.expires_at?new Date(r.expires_at).toLocaleDateString():'—'}</td><td><span class="pill ${r.active?'on':'off'}">${r.active?'Active':'Blocked'}</span></td><td><button class="btn light" onclick="toggleAccess('${r.email}',${!r.active})">${r.active?'Block':'Activate'}</button></td></tr>`).join('')}
window.toggleAccess=async(email,active)=>{const {error}=await sb.from('entitlements').update({active}).eq('email',email);if(error)msg('#panelStatus',error.message);else refresh()};q('#refresh').onclick=refresh;sb.auth.onAuthStateChange(()=>setTimeout(load,0));load();
</script></body></html>
